<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XEON Intro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020104;
            color: #ffecef;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        #intro-canvas,
        #transition {
            position: fixed;
            inset: 0;
        }

        #intro-canvas {
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 50%, #23040a 0%, #050103 48%, #000 100%);
        }

        #hud-copy {
            position: fixed;
            left: 28px;
            bottom: 28px;
            display: grid;
            gap: 8px;
            z-index: 2;
            color: #ffb3bb;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .16em;
            opacity: .82;
            text-shadow: 0 0 16px rgba(255, 51, 71, .55);
        }

        #hud-copy strong {
            color: #ff3347;
            font-size: 16px;
            letter-spacing: .2em;
        }

        #transition {
            z-index: 4;
            display: grid;
            place-items: center;
            align-content: center;
            gap: 118px;
            background:
                radial-gradient(circle at 50% 50%, rgba(255, 51, 71, .22), transparent 32%),
                linear-gradient(rgba(255, 51, 71, .08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 51, 71, .08) 1px, transparent 1px),
                #020104;
            background-size: 100% 100%, 42px 42px, 42px 42px;
            color: #ff3347;
            font: 800 clamp(54px, 11vw, 132px)/1 "Segoe UI", Arial, sans-serif;
            opacity: 0;
            pointer-events: none;
            text-shadow: 0 0 44px rgba(255, 51, 71, .78);
            transform: scale(1.045);
            filter: blur(14px) brightness(.68);
            transition: opacity 1300ms ease, transform 1300ms cubic-bezier(.2, .8, .2, 1), filter 1300ms ease;
        }

        #transition-title {
            display: block;
        }

        #transition::before {
            content: "SYSTEM HANDOFF";
            position: absolute;
            top: calc(50% + 82px);
            color: #ffb3bb;
            font: 650 13px/1 "Segoe UI", Arial, sans-serif;
            letter-spacing: .18em;
        }

        #handoff-progress {
            position: absolute;
            top: calc(50% + 118px);
            left: 50%;
            width: min(420px, calc(100vw - 48px));
            height: 18px;
            transform: translateX(-50%);
            border: 1px solid rgba(255, 70, 90, .62);
            border-radius: 8px;
            background: rgba(8, 1, 3, .72);
            box-shadow: 0 0 28px rgba(255, 51, 71, .28), inset 0 0 18px rgba(255, 51, 71, .08);
            overflow: hidden;
        }

        #handoff-progress i {
            display: block;
            width: var(--handoff-progress, 0%);
            height: 100%;
            background:
                linear-gradient(90deg, rgba(255, 255, 255, .18), transparent 28%),
                linear-gradient(90deg, #8d0f1e, #ff3347 58%, #ffd7dc);
            box-shadow: 0 0 22px rgba(255, 51, 71, .78);
            transition: width 80ms linear;
        }

        #handoff-percent {
            position: absolute;
            top: calc(50% + 146px);
            left: 50%;
            transform: translateX(-50%);
            color: #ffb3bb;
            font: 700 12px/1 "Segoe UI", Arial, sans-serif;
            letter-spacing: .12em;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 16px rgba(255, 51, 71, .55);
        }

        #transition::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            height: 20%;
            top: -22%;
            background: linear-gradient(180deg, transparent, rgba(255, 51, 71, .16), transparent);
            animation: intro-handoff-scan 1.35s linear infinite;
        }

        body.leaving #intro-canvas,
        body.leaving #hud-copy {
            opacity: 0;
            filter: blur(18px) brightness(.38);
            transform: scale(1.035);
            transition: opacity 1300ms ease, filter 1300ms ease, transform 1300ms cubic-bezier(.2, .8, .2, 1);
        }

        body.leaving #transition {
            opacity: 1;
            transform: scale(1);
            filter: blur(0) brightness(1);
        }

        @keyframes intro-handoff-scan {
            from { top: -22%; }
            to { top: 104%; }
        }
    </style>
</head>
<body>
    <canvas id="intro-canvas"></canvas>
    <div id="hud-copy">
        <strong>XEON CORE</strong>
        <span>Neural interface boot sequence</span>
        <span>Trade intelligence uplink</span>
        <span>Operator channel secured</span>
    </div>
    <div id="transition">
        <span id="transition-title">XEON</span>
        <div id="handoff-progress" aria-hidden="true"><i></i></div>
        <div id="handoff-percent">0%</div>
    </div>

    <script>
        const canvas = document.getElementById('intro-canvas');
        const ctx = canvas.getContext('2d');
        const handoffProgress = document.getElementById('handoff-progress');
        const handoffPercent = document.getElementById('handoff-percent');
        const prewarmId = `intro-${Date.now()}-${Math.random().toString(16).slice(2)}`;
        const durationMs = 5000;
        const startedAt = performance.now();
        let finished = false;
        let progressStartedAt = 0;
        let handoffReady = false;
        let handoffProgressValue = 0;
        let prewarmStarted = false;
        let audioContext = null;
        let masterGain = null;

        function resize() {
            const scale = Math.min(2, window.devicePixelRatio || 1);
            canvas.width = Math.floor(window.innerWidth * scale);
            canvas.height = Math.floor(window.innerHeight * scale);
            canvas.style.width = `${window.innerWidth}px`;
            canvas.style.height = `${window.innerHeight}px`;
            ctx.setTransform(scale, 0, 0, scale, 0, 0);
        }

        function startSound() {
            if (audioContext) return;
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            audioContext = new AudioCtx();
            masterGain = audioContext.createGain();
            masterGain.gain.value = 0.0;
            masterGain.connect(audioContext.destination);
            masterGain.gain.linearRampToValueAtTime(0.22, audioContext.currentTime + 0.45);
            masterGain.gain.linearRampToValueAtTime(0.12, audioContext.currentTime + 4.35);
            masterGain.gain.linearRampToValueAtTime(0.0, audioContext.currentTime + 4.9);

            const low = audioContext.createOscillator();
            const lowFilter = audioContext.createBiquadFilter();
            low.type = 'sine';
            low.frequency.value = 52;
            lowFilter.type = 'lowpass';
            lowFilter.frequency.value = 480;
            low.connect(lowFilter);
            lowFilter.connect(masterGain);
            low.start();
            low.stop(audioContext.currentTime + 5.0);

            [0.55, 1.45, 2.45, 3.45, 4.2].forEach((offset, index) => {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.type = 'triangle';
                osc.frequency.value = [164.81, 220, 277.18, 329.63, 440][index];
                gain.gain.setValueAtTime(0.001, audioContext.currentTime + offset);
                gain.gain.exponentialRampToValueAtTime(0.12, audioContext.currentTime + offset + 0.04);
                gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + offset + 0.72);
                osc.connect(gain);
                gain.connect(masterGain);
                osc.start(audioContext.currentTime + offset);
                osc.stop(audioContext.currentTime + offset + 0.8);
            });
        }

        function setHandoffProgress(pct) {
            handoffProgressValue = Math.max(handoffProgressValue, Math.min(100, Math.round(pct)));
            handoffProgress.style.setProperty('--handoff-progress', `${handoffProgressValue}%`);
            handoffPercent.textContent = `${handoffProgressValue}%`;
        }

        function animateHandoffProgress(now) {
            if (!progressStartedAt) progressStartedAt = now;
            const elapsed = now - progressStartedAt;
            const cap = handoffReady ? 100 : 94;
            const target = handoffReady
                ? 100
                : Math.min(cap, 18 + (elapsed / 1800) * 76);
            setHandoffProgress(target);
            if (handoffProgressValue < 100) requestAnimationFrame(animateHandoffProgress);
        }

        function startPrewarm() {
            if (prewarmStarted) return;
            prewarmStarted = true;
            try {
                sessionStorage.setItem('xeonIntroPrewarmId', prewarmId);
                fetch('/api/intro-prewarm', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: prewarmId, speak: true }),
                    keepalive: true
                }).catch(() => {});
            } catch (_) {}
        }

        async function waitForPrewarmReady() {
            startPrewarm();
            while (true) {
                try {
                    const response = await fetch(`/api/intro-prewarm/${encodeURIComponent(prewarmId)}?t=${Date.now()}`, { cache: 'no-store' });
                    if (response.ok) {
                        const data = await response.json();
                        if (data.status === 'ready') return true;
                        if (data.status === 'missing' || data.status === 'error') {
                            prewarmStarted = false;
                            startPrewarm();
                        }
                    }
                } catch (_) {}
                await new Promise(resolve => window.setTimeout(resolve, 300));
            }
        }

        async function finish() {
            if (finished) return;
            finished = true;
            if (masterGain && audioContext) {
                masterGain.gain.cancelScheduledValues(audioContext.currentTime);
                masterGain.gain.linearRampToValueAtTime(0.08, audioContext.currentTime + 0.5);
            }
            document.body.classList.add('leaving');
            requestAnimationFrame(animateHandoffProgress);
            await waitForPrewarmReady();
            handoffReady = true;
            if (masterGain && audioContext) {
                masterGain.gain.cancelScheduledValues(audioContext.currentTime);
                masterGain.gain.linearRampToValueAtTime(0.0, audioContext.currentTime + 0.42);
            }
            window.setTimeout(() => window.location.replace(`/?intro=complete&prewarm=${encodeURIComponent(prewarmId)}&v=generated-intro-3`), 520);
        }

        function lineCircle(cx, cy, radius, start, end, color, width = 1.5) {
            ctx.beginPath();
            ctx.arc(cx, cy, radius, start, end);
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.stroke();
        }

        function draw(now) {
            const elapsed = now - startedAt;
            const progress = Math.min(1, elapsed / durationMs);
            const w = window.innerWidth;
            const h = window.innerHeight;
            const cx = w / 2;
            const cy = h / 2;
            const base = Math.min(w, h);
            ctx.clearRect(0, 0, w, h);

            const background = ctx.createRadialGradient(cx, cy, 0, cx, cy, base * 0.7);
            background.addColorStop(0, `rgba(255, 51, 71, ${0.16 + progress * 0.1})`);
            background.addColorStop(0.38, 'rgba(40, 5, 12, .62)');
            background.addColorStop(1, '#000');
            ctx.fillStyle = background;
            ctx.fillRect(0, 0, w, h);

            ctx.save();
            ctx.globalAlpha = 0.22;
            ctx.strokeStyle = 'rgba(255, 80, 100, .26)';
            ctx.lineWidth = 1;
            const grid = 42;
            const offset = (elapsed * 0.018) % grid;
            for (let x = -grid + offset; x < w + grid; x += grid) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, h);
                ctx.stroke();
            }
            for (let y = -grid + offset; y < h + grid; y += grid) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(w, y);
                ctx.stroke();
            }
            ctx.restore();

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(elapsed * 0.00042);
            const rings = [0.16, 0.24, 0.34, 0.46].map(v => base * v);
            rings.forEach((radius, index) => {
                const spin = elapsed * (0.0008 + index * 0.00018);
                lineCircle(0, 0, radius, spin, spin + Math.PI * (1.05 + index * 0.16), `rgba(255, ${54 + index * 18}, ${72 + index * 10}, ${0.48 - index * 0.05})`, 1.5);
                lineCircle(0, 0, radius, spin + Math.PI * 1.35, spin + Math.PI * 1.55, 'rgba(255, 210, 216, .72)', 2);
            });
            ctx.restore();

            for (let i = 0; i < 28; i += 1) {
                const angle = i * 0.72 + elapsed * 0.00055;
                const radius = base * (0.12 + ((i * 37) % 42) / 100);
                const x = cx + Math.cos(angle) * radius;
                const y = cy + Math.sin(angle * 0.86) * radius * 0.55;
                ctx.fillStyle = i % 5 === 0 ? 'rgba(255, 220, 225, .9)' : 'rgba(255, 51, 71, .72)';
                ctx.beginPath();
                ctx.arc(x, y, i % 5 === 0 ? 2.7 : 1.8, 0, Math.PI * 2);
                ctx.fill();
            }

            const corePulse = 0.5 + Math.sin(elapsed * 0.005) * 0.5;
            const coreRadius = base * (0.082 + corePulse * 0.008 + progress * 0.018);
            const coreGradient = ctx.createRadialGradient(cx - coreRadius * 0.25, cy - coreRadius * 0.25, 0, cx, cy, coreRadius * 1.4);
            coreGradient.addColorStop(0, '#fff2f4');
            coreGradient.addColorStop(0.24, '#ff3347');
            coreGradient.addColorStop(0.72, '#6f0d1a');
            coreGradient.addColorStop(1, 'rgba(20, 2, 5, .2)');
            ctx.fillStyle = coreGradient;
            ctx.shadowColor = 'rgba(255, 51, 71, .85)';
            ctx.shadowBlur = 54;
            ctx.beginPath();
            ctx.arc(cx, cy, coreRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#ff3347';
            ctx.font = `800 ${Math.max(46, base * 0.098)}px "Segoe UI", Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(255, 51, 71, .7)';
            ctx.shadowBlur = 26;
            ctx.fillText('XEON', cx, cy + base * 0.245);
            ctx.shadowBlur = 0;

            ctx.fillStyle = 'rgba(255, 215, 220, .78)';
            ctx.font = '600 12px "Segoe UI", Arial';
            ctx.fillText('GLOBAL TRADE INTELLIGENCE CORE', cx, cy + base * 0.305);

            const scanY = (elapsed * 0.22) % (h + 180) - 90;
            const scan = ctx.createLinearGradient(0, scanY - 70, 0, scanY + 70);
            scan.addColorStop(0, 'rgba(255, 51, 71, 0)');
            scan.addColorStop(.5, 'rgba(255, 51, 71, .16)');
            scan.addColorStop(1, 'rgba(255, 51, 71, 0)');
            ctx.fillStyle = scan;
            ctx.fillRect(0, scanY - 70, w, 140);

            if (!finished && elapsed >= durationMs) finish();
            if (!finished) requestAnimationFrame(draw);
        }

        resize();
        startPrewarm();
        startSound();
        requestAnimationFrame(draw);
        window.addEventListener('resize', resize);
        window.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') event.preventDefault();
        }, { capture: true });
        window.addEventListener('click', () => startSound());
        window.setTimeout(finish, durationMs + 900);
    </script>
</body>
</html>
